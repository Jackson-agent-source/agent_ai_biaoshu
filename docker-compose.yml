# ============================================================
# 生产部署（Docker Compose）
#
# 三个服务：
#   web      nginx：对外唯一入口。前端页面 + 反代后端
#   backend  gunicorn 跑 Django
#   db       MySQL 8
#
# 用法：
#   cp .env.deploy.example .env   然后把里面的值改掉（见文件里的说明）
#   docker compose build
#   docker compose up -d
#   docker compose exec backend python manage.py createsuperuser
#
# 架构说明（为什么是"同源"）：
#   前端页面和 API 由同一个 nginx 提供，浏览器认为它们是同源的，
#   CORS 问题彻底消失，前端也能用相对路径 /api/v1，
#   将来换域名不用重新构建前端。
#
# ★★ TLS 不在这一层终结。
#
#    对外的 HTTPS 由**宿主机上的宝塔 nginx** 负责：它监听 80/443、
#    持有证书、做 HTTP→HTTPS 跳转，再把请求反代到 127.0.0.1:8080，
#    也就是下面的 web 容器。
#
#    这样做是因为这台机器上**还有别的网站在宝塔上**，两个 nginx
#    抢同一个端口会把那个站一起搞挂。完整背景见 README 12.10。
#
#    ★ 配套的两个前提，缺一个网站就打不开：
#      1) 宝塔的站点配置里必须发 X-Forwarded-Proto，且 Host 要透传
#         —— 见 README 12.10 第 4 步
#      2) WEB_BIND 保持 127.0.0.1，别把容器直接暴露到公网（见下面 ports）
# ============================================================

services:
  # ------------------------------------------------------------------
  # 数据库
  # ------------------------------------------------------------------
  db:
    image: mysql:8.0
    # ★ 必须 8.0.11 以上，这是 Django 5.2 的硬性要求。
    #   （本机开发用的是 SQLite，就是因为这台机器上是 MySQL 5.7。）
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    volumes:
      # ★★★ 这个卷里是全部文章和账号。执行 docker compose down -v
      #      （或者手工删掉这个卷）会**永久删除所有数据**，无法恢复。
      #      升级代码用 down / up 没问题，但不要加 -v。
      - mysql_data:/var/lib/mysql

    # ★ 不映射端口到宿主机。
    #   数据库只需要被 backend 容器通过容器网络访问，
    #   暴露到公网没有任何好处，只有风险。
    expose:
      - "3306"

    healthcheck:
      # ★ 容器还活着 ≠ 数据库能用了。MySQL 首次启动要初始化系统表，
      #   这段时间里端口可能是通的。用 mysqladmin 真实探活，
      #   start_period 给它 40 秒的初始化宽限期，期间失败不算数。
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

    # 不限制日志大小的话，Docker 会把日志一直堆在磁盘上，
    # 时间长了能把整块盘写满（这个坑很经典）。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ------------------------------------------------------------------
  # 后端
  # ------------------------------------------------------------------
  backend:
    build:
      context: ./backend
    restart: unless-stopped

    # ★ 整份配置都从这个文件来。项目里**只有这一份** .env，
    #   不要再有 backend/.env —— 两处配置一定会写岔，
    #   而且排查时会先看错的那一份。
    env_file:
      - .env
    # 容器间连接固定使用服务名，避免误用本地开发的 SQLite/127.0.0.1。
    environment: &backend_database
      DB_ENGINE: mysql
      DB_HOST: db
      DB_PORT: "3306"

    depends_on:
      db:
        # ★ 必须是 service_healthy，不能用 service_started。
        #   MySQL 的"启动了"和"能连了"之间隔着十几秒，
        #   用 started 的话 entrypoint 的 migrate 会撞在初始化中途然后失败，
        #   容器进入重启循环，表现是 docker compose ps 一直显示 Restarting。
        condition: service_healthy

    volumes:
      # ★ AI 配图的文件。Django 往 /app/media 写（MEDIA_ROOT = BASE_DIR/"media"），
      #   nginx 从同一个卷只读地发出去。
      #
      # ★★ 和 mysql_data 一样，`docker compose down -v` 会**连图片一起删**，
      #     而且不可恢复。不带 -v 的 down/up 是安全的。
      #     备份见 README 的部署章节 —— 只 dump 数据库会丢图。
      #
      # ★ 用命名卷而不是 bind mount（./media:/app/media）：
      #   命名卷不需要在服务器上预先建目录，也不用操心属主，
      #   而且不带 -v 的 down 不会动它。
      - uploads:/app/media

    # 只给 nginx 用，不映射到宿主机
    expose:
      - "8000"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 独立单实例调度器；不占用 Web worker，也不会因 gunicorn 多进程重复执行。
  trend_scheduler:
    build:
      context: ./backend
    entrypoint: ["/bin/sh", "/app/trend_scheduler.sh"]
    restart: unless-stopped
    env_file:
      - .env
    environment: *backend_database
    volumes:
      - uploads:/app/media
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ------------------------------------------------------------------
  # 前端（构建好的静态文件 + nginx 反代）
  # ------------------------------------------------------------------
  web:
    build:
      context: ./frontend
      args:
        # ★ 必须是相对路径，而且必须是**构建时**传进去的。
        #   Vite 的环境变量是静态内联进 JS 的 —— 运行期改容器环境变量没用，
        #   字符串已经在 bundle 里了。
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped

    environment:
      # ★ 告诉 nginx 后台上在哪个路径下，它才能把请求反代给 Django。
      #   不传的话 nginx 会用它自己的默认值 /admin/ ——
      #   而你在 .env 里把后台改成了随机路径，
      #   结果就是后台页面打不开（请求被当成前端路由，返回 index.html）。
      #
      #   `${VAR:-默认值}` 是 compose 的语法：没配就用冒号后面的值。
      #   compose 会自动读取项目根目录的 .env 来做这个替换，
      #   所以这里拿到的和 backend 容器里的是同一个值。
      ADMIN_URL_PATH: ${ADMIN_URL_PATH:-admin/}

      # ★ 这里**没有** PUBLIC_HOST 了。
      #   容器内的 nginx 不再负责 TLS，也就不需要知道域名 ——
      #   域名匹配、证书、跳转全在宝塔那边完成，
      #   转发进来时 Host 头已经是原始域名了。
      #   域名相关的配置都在 .env 里（ALLOWED_HOSTS / SITE_ORIGIN /
      #   CSRF_TRUSTED_ORIGINS 等），由 backend 容器读取。

    volumes:
      # ★ 配图。nginx 直接从卷里发 /media/，请求根本不进 Django：
      #   后端只有 3×4=12 个 gthread worker，图片如果都走 Django，
      #   几张图就能把 API 请求饿死。
      #
      # ★ :ro 只读 —— nginx 只需要读，不需要也不该有写权限。
      - uploads:/var/www/media:ro

      # ★ 这里**不再挂证书**。
      #   证书属于宝塔，跟这个容器没关系 —— 我们只讲明文 HTTP，
      #   而且只对回环地址讲（见下面的 ports）。

    depends_on:
      backend:
        # ★ 这里故意用 service_started 而不是 service_healthy。
        #
        #   nginx 一起来就能把前端页面发出去，用户马上看到登录页；
        #   这时候后端可能还在 migrate，接口会短暂 502。
        #   等 healthy 的话，用户会先对着一个白屏等将近一分钟，
        #   体验差得多。
        condition: service_started

    ports:
      # ★★★ 只绑回环地址，**不要**改成 0.0.0.0。
      #
      #   这是安全问题，不是洁癖：容器里的 nginx 会把宝塔传来的
      #   X-Forwarded-Proto **原样透传**给 Django，而 Django 拿它
      #   判断"这个请求算不算 https"。一旦这个端口能从公网直连，
      #   任何人都能绕过宝塔、自己伪造一个 X-Forwarded-Proto: https，
      #   让 Django 把一个明文请求当成加密请求处理。
      #
      #   绑在 127.0.0.1 上，就只有宿主机上的宝塔能连到它。
      #
      # ★ 对外的 80/443 由**宝塔**监听，不需要在这里映射，
      #   所以 8080 这个端口**不用**在云安全组里放行。
      #   安全组里要开的 80/443 是给宝塔用的，跟这个容器无关。
      #
      # ★ 想换端口就改 .env 里的 WEB_PORT，容器内部永远是 80。
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
  # ★ AI 配图（backend 写，web 只读）。
  #   备份时必须把它和 mysql_data 一起打包，只 dump 数据库会丢图 ——
  #   见 README 的部署章节。
  uploads:
