# ============================================================
# 生产部署（Docker Compose）
#
# 三个服务：
#   web      nginx：对外唯一入口。前端页面 + 反代后端
#   backend  gunicorn 跑 Django
#   db       MySQL 8
#
# 用法：
#   cp .env.deploy.example .env   然后把里面的值改掉（见文件里的说明）
#   docker compose build
#   docker compose up -d
#   docker compose exec backend python manage.py createsuperuser
#
# 架构说明（为什么是"同源"）：
#   前端页面和 API 由同一个 nginx 提供，浏览器认为它们是同源的，
#   CORS 问题彻底消失，前端也能用相对路径 /api/v1，
#   将来换域名不用重新构建前端。
#
# ★★ 这份配置现在假设**你有域名，并且已经签好证书**（nginx 的 443 块
#    会加载 /etc/letsencrypt/live/${PUBLIC_HOST}/ 下的证书，
#    没有证书 nginx 起不来）。签发的完整步骤见 README 12.10。
#
#    想回到"只有公网 IP、纯 HTTP"的老用法：把 frontend/nginx.conf 里的
#    443 块和 80 块的跳转注释掉，再把 .env 的 WEB_PORT 改回 8080。
# ============================================================

services:
  # ------------------------------------------------------------------
  # 数据库
  # ------------------------------------------------------------------
  db:
    image: mysql:8.0
    # ★ 必须 8.0.11 以上，这是 Django 5.2 的硬性要求。
    #   （本机开发用的是 SQLite，就是因为这台机器上是 MySQL 5.7。）
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    volumes:
      # ★★★ 这个卷里是全部文章和账号。执行 docker compose down -v
      #      （或者手工删掉这个卷）会**永久删除所有数据**，无法恢复。
      #      升级代码用 down / up 没问题，但不要加 -v。
      - mysql_data:/var/lib/mysql

    # ★ 不映射端口到宿主机。
    #   数据库只需要被 backend 容器通过容器网络访问，
    #   暴露到公网没有任何好处，只有风险。
    expose:
      - "3306"

    healthcheck:
      # ★ 容器还活着 ≠ 数据库能用了。MySQL 首次启动要初始化系统表，
      #   这段时间里端口可能是通的。用 mysqladmin 真实探活，
      #   start_period 给它 40 秒的初始化宽限期，期间失败不算数。
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

    # 不限制日志大小的话，Docker 会把日志一直堆在磁盘上，
    # 时间长了能把整块盘写满（这个坑很经典）。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ------------------------------------------------------------------
  # 后端
  # ------------------------------------------------------------------
  backend:
    build:
      context: ./backend
    restart: unless-stopped

    # ★ 整份配置都从这个文件来。项目里**只有这一份** .env，
    #   不要再有 backend/.env —— 两处配置一定会写岔，
    #   而且排查时会先看错的那一份。
    env_file:
      - .env

    depends_on:
      db:
        # ★ 必须是 service_healthy，不能用 service_started。
        #   MySQL 的"启动了"和"能连了"之间隔着十几秒，
        #   用 started 的话 entrypoint 的 migrate 会撞在初始化中途然后失败，
        #   容器进入重启循环，表现是 docker compose ps 一直显示 Restarting。
        condition: service_healthy

    volumes:
      # ★ AI 配图的文件。Django 往 /app/media 写（MEDIA_ROOT = BASE_DIR/"media"），
      #   nginx 从同一个卷只读地发出去。
      #
      # ★★ 和 mysql_data 一样，`docker compose down -v` 会**连图片一起删**，
      #     而且不可恢复。不带 -v 的 down/up 是安全的。
      #     备份见 README 的部署章节 —— 只 dump 数据库会丢图。
      #
      # ★ 用命名卷而不是 bind mount（./media:/app/media）：
      #   命名卷不需要在服务器上预先建目录，也不用操心属主，
      #   而且不带 -v 的 down 不会动它。
      - uploads:/app/media

    # 只给 nginx 用，不映射到宿主机
    expose:
      - "8000"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ------------------------------------------------------------------
  # 前端（构建好的静态文件 + nginx 反代）
  # ------------------------------------------------------------------
  web:
    build:
      context: ./frontend
      args:
        # ★ 必须是相对路径，而且必须是**构建时**传进去的。
        #   Vite 的环境变量是静态内联进 JS 的 —— 运行期改容器环境变量没用，
        #   字符串已经在 bundle 里了。
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped

    environment:
      # ★ 告诉 nginx 后台上在哪个路径下，它才能把请求反代给 Django。
      #   不传的话 nginx 会用它自己的默认值 /admin/ ——
      #   而你在 .env 里把后台改成了随机路径，
      #   结果就是后台页面打不开（请求被当成前端路由，返回 index.html）。
      #
      #   `${VAR:-默认值}` 是 compose 的语法：没配就用冒号后面的值。
      #   compose 会自动读取项目根目录的 .env 来做这个替换，
      #   所以这里拿到的和 backend 容器里的是同一个值。
      ADMIN_URL_PATH: ${ADMIN_URL_PATH:-admin/}

      # ★ 域名。nginx 用它拼两个东西：
      #     1) 证书路径 /etc/letsencrypt/live/<域名>/fullchain.pem
      #     2) HTTP → HTTPS 跳转的目标地址
      #   （跳转**不能**用 nginx 的 $host 来拼 —— 那个值来自请求头，
      #     可以被伪造，会变成开放重定向。）
      #
      #   填错的表现是 nginx 起不来，报找不到证书文件 —— 响亮的失败。
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}

    volumes:
      # ★ 配图。nginx 直接从卷里发 /media/，请求根本不进 Django：
      #   后端只有 3×4=12 个 gthread worker，图片如果都走 Django，
      #   几张图就能把 API 请求饿死。
      #
      # ★ :ro 只读 —— nginx 只需要读，不需要也不该有写权限。
      - uploads:/var/www/media:ro

      # ★ TLS 证书。由**宿主机**上的 certbot 签发和续期，容器只读。
      #
      #   整个 /etc/letsencrypt 一起挂，而不是只挂 live/<域名>：
      #   live/ 里全是符号链接，指向 ../../archive/<域名>/...
      #   只挂一层的话链接会断，nginx 报找不到文件。
      #
      #   ★ 首次签发是在**容器跑起来之前**做的（见 README 12.10 第 4 步），
      #     所以这里挂载时目录已经存在。证书还没签就 up，nginx 会起不来。
      - /etc/letsencrypt:/etc/letsencrypt:ro

      # ★ 证书续期走 webroot 模式时，certbot 把验证文件写到这里，
      #   再由 nginx 通过 http://<域名>/.well-known/acme-challenge/ 发出去。
      #   挂成只读是因为容器只负责"发"，写的活由宿主机上的 certbot 干。
      - /var/www/certbot:/var/www/certbot:ro

    depends_on:
      backend:
        # ★ 这里故意用 service_started 而不是 service_healthy。
        #
        #   nginx 一起来就能把前端页面发出去，用户马上看到登录页；
        #   这时候后端可能还在 migrate，接口会短暂 502。
        #   等 healthy 的话，用户会先对着一个白屏等将近一分钟，
        #   体验差得多。
        condition: service_started

    ports:
      # 对外暴露的端口：80（跳转 + 证书验证）、443（真正的站点）。
      # 防火墙只需要放行这两个（和 SSH）。
      #
      # ★ 上了 HTTPS 之后 WEB_PORT 要改成 **80**。
      #   默认值仍然是 8080，是为了兼容"没有域名、纯 HTTP"的老用法。
      #
      # ★ 如果这台服务器上装了宝塔，它自带的 nginx 会占着 80，
      #   这时候必须先把宝塔的 nginx 停掉并禁止自启（README 12.10 第 2 步），
      #   否则这里会报：
      #       Bind for 0.0.0.0:80 failed: port is already allocated
      #
      # ★ WEB_BIND 是监听地址，一般不用改：
      #     0.0.0.0   直接对外
      #     127.0.0.1 只有本机能连（前面还有一层别的反向代理时才这么用）
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:80"

      # ★ 443 单独一个变量，万一被别的服务占着可以换（改这里 + .env 的
      #   HTTPS_PORT 即可，nginx 配置一个字都不用动 —— 容器内部永远是 443）。
      #
      # ★ HTTPS_PORT 只活在 compose 这一层，**不要**加进上面的
      #   environment: 里，那样它会变成 nginx 的变量名冲突隐患。
      - "${WEB_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
  # ★ AI 配图（backend 写，web 只读）。
  #   备份时必须把它和 mysql_data 一起打包，只 dump 数据库会丢图 ——
  #   见 README 的部署章节。
  uploads:
