# ============================================================
# 容器内的 nginx（纯 HTTP，只监听 80）
#
#   /                    -> 前端静态文件（Vue 打包产物）
#   /api/ /health/       -> 反代给 Django
#   /<ADMIN_URL_PATH>    -> 反代给 Django 后台（默认 /admin/）
#   /static/             -> 反代给 Django（whitenoise 提供的 Admin CSS 等）
#   /media/              -> 直接从 uploads 卷发 AI 配图（不经过 Django）
#
# 这样浏览器看到的前端和 API 是**同一个源**，
# CORS、Cookie、预检请求的问题一次性全部消失。
#
# ★★★ 这个 nginx **不负责 TLS**，这是刻意的。
#
#     对外的 HTTPS 由**宿主机上的宝塔 nginx** 终结，宝塔再把请求
#     反代到 127.0.0.1:8080 —— 也就是这里。所以：
#
#       · 这里没有任何 ssl_* 配置，也不监听 443
#       · 这里不做 HTTP→HTTPS 跳转 —— 那是宝塔那边「强制 HTTPS」的事
#       · 这里没有 ACME 验证路径 —— 证书由宝塔自己签发和续期
#
#     ★ 为什么不让这个容器独占 80/443：**这台机器上还有别的网站在宝塔上**
#       （supermanapi.online）。两个 nginx 抢同一个端口，要么容器起不来
#       （port is already allocated），要么那个站被搞挂。
#       完整背景和取舍见 README 12.10。
#
# ★★★ 这个文件是**模板**，不是最终的 nginx 配置。
#     Dockerfile 把它拷成 /etc/nginx/templates/default.conf.template，
#     nginx 官方镜像的入口脚本会用 envsubst 把 ${ADMIN_URL_PATH}
#     替换成实际值，再生成 /etc/nginx/conf.d/default.conf。
#
#     envsubst 只替换**环境里真实存在**的变量名，所以下面那些
#     $uri / $host / $remote_addr / $scheme 是 nginx 自己的变量，不会被动到。
#
# ★★★ 三处反代都用 X-Forwarded-Proto $http_x_forwarded_proto（透传），
#     **不是** $scheme。这是整个文件里最要命的一行，改动前先读完这段。
#
#     请求链路是：
#         浏览器 --https--> 宝塔 --http--> 这个容器 --http--> Django
#
#     宝塔到我们这一段是**明文 HTTP**，所以容器里 $scheme 恒等于 "http"。
#     而 Django 打开 USE_HTTPS 之后有 SECURE_SSL_REDIRECT，它判断
#     "这个请求算不算 https"的**唯一**依据就是 X-Forwarded-Proto
#     （settings.py 里的 SECURE_PROXY_SSL_HEADER）。
#
#     所以如果这里写 $scheme，就会变成：
#         Django 认为请求是 http → 301 到 https://<域名><同一个路径>
#         → 浏览器照做 → 宝塔再转发进来 → 还是 http → 又 301 → ……
#     **无限重定向**，浏览器最后报「重定向次数过多」。
#     症状具有极强的误导性：网站整个打不开，但每个容器都是 healthy，
#     因为健康检查走的是容器内部、根本不经过这条路。
#
#     正确做法是**透传宝塔发来的那个头**。前提是宝塔的站点配置里
#     真的发了它 —— 见 README 12.10 第 4 步，那一步不能省。
# ============================================================

server {
    listen 80;

    # ★ 兜底的 server_name。真正的域名匹配在**宝塔**那边完成，
    #   请求转发进来时 Host 头已经是原始域名了。
    #
    #   这里用 _ 而不是写死域名：容器只会被宝塔从回环地址访问，
    #   不需要靠 server_name 挑站点，写死反而多一个要同步的配置项 ——
    #   改域名时漏改这一处，表现是"页面能开但接口全 404"，很难查。
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ★ 上传实拍图是**唯一**需要放行大请求体的接口，上限是 12m。
    #
    #   为什么是 12m 而不是"够用就好"的 2m：
    #   后端 apps/imaging/views.py 自己有一道 10MB 的检查，超过会返回
    #   一句中文（"图片太大了（13MB），最大支持 10MB，可以先在手机上压小一点"）。
    #   如果这里卡在 2m，超限的请求**根本到不了后端**，
    #   用户看到的是 nginx 自己那个白底黑字的 413 页面 ——
    #   没有中文、没有原因、也没有"怎么办"。所以这一层要比后端**宽**，
    #   让它只负责挡住"别把 100MB 灌进我的进程"，判定和解释交给后端。
    #
    #   ★ 正常情况根本用不到这个数：前端会用 canvas 先把照片压到 1600px
    #     再传（utils/imageResize.ts），一般只有几百 KB。
    #     这个上限是给"前端没压成"（老浏览器、canvas 被禁用）兜底的。
    #
    #   ★★ 宝塔那一层也是 1m 的默认值，要一起调大，否则先在那里被挡住。
    #      见 README 12.10。
    client_max_body_size 12m;

    # 关掉版本号，别白送给扫描器
    server_tokens off;

    # ------------------------------------------------------------------
    # 容器自己的健康检查打这里
    # ------------------------------------------------------------------
    # ★ 路径特意叫 /healthz 而不是 /health/ —— 后者是 Django 的接口，
    #   两个名字长得像会让人以为是同一个东西。
    #
    # ★ 打这个而不是 /：/healthz 是一个直接 return 200 的 location，
    #   不碰后端、不读磁盘，容器一起来就能通过。
    #   打 / 的话会走 try_files 去读 index.html，镜像没构建好时
    #   健康检查的失败原因会和"页面挂了"混在一起。
    location = /healthz {
        return 200 "ok\n";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # ------------------------------------------------------------------
    # 前端页面
    # ------------------------------------------------------------------
    location / {
        # ★ history 模式路由的必需品。
        #
        #   前端用的是 createWebHistory()，所以 /articles/xxx 这种地址
        #   在服务器磁盘上**并不存在**对应的文件。没有这行的话，
        #   用户在文章详情页按 F5 会看到 nginx 的 404 页面，
        #   而不是应用本身 —— 这是 SPA 部署最经典的一个坑。
        try_files $uri $uri/ /index.html;
    }

    # ★ index.html 绝对不能缓存。
    #   它里面写着本次构建的那些带哈希的 JS/CSS 文件名；
    #   一旦被浏览器缓存住，你发了新版用户刷新还是加载旧的资源，
    #   表现是"更新了但页面上看不出变化"。
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    # /assets/ 下的文件名带内容哈希，内容变了文件名就变，
    # 所以可以放心让浏览器长期缓存。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ------------------------------------------------------------------
    # AI 配图（backend 写进共享卷，这里只读直发）
    # ------------------------------------------------------------------
    # ★ 为什么用 ^~：^~ 前缀匹配的优先级**高于正则匹配**。
    #   不加的话，请求会先做前缀匹配、再拿下面每一条正则去试一遍；
    #   现在那条 location ~ ^/(api|admin|health)/ 虽然匹配不到 /media/，
    #   但将来任何一条新加的正则一旦手滑命中 /media/，配图就会全挂，
    #   而且症状是"图片 404"而不是"nginx 起不来"，很难查。^~ 一次钉死。
    #
    # ★ 图片请求**不会**掉进 location / 的 try_files ... /index.html：
    #   那句 SPA 回退只对 location / 生效，/media/ 命中这个块之后
    #   就再也不看别的了。所以这里不需要（也不该）写 try_files ——
    #   try_files 和 alias 一起用是 nginx 上有名的坑
    #   （它会按 location 前缀而不是 alias 路径去拼）。
    #
    # ★ 必须是 alias 不是 root：
    #     alias 把 /media/x.jpg 映射成 /var/www/media/x.jpg
    #     root  会映射成 /var/www/media/media/x.jpg
    #   两边的结尾斜杠都要有，少一个就是 404。
    location ^~ /media/ {
        alias /var/www/media/;

        # 配图一旦写入就永不修改（重新生成是**新建一条记录 + 新文件名**），
        # 所以可以放心让浏览器长期缓存。
        # ★ 只用 add_header 写一条 Cache-Control，**不要**同时写 expires：
        #   两者都设会产生两个同名的 Cache-Control 响应头，语义还互相覆盖。
        add_header Cache-Control "public, max-age=31536000, immutable";

        # 配图是高频小文件，访问日志只会淹没有用的日志
        access_log off;
    }

    # ------------------------------------------------------------------
    # 后台（路径由 ADMIN_URL_PATH 决定，默认 /admin/）
    # ------------------------------------------------------------------
    # ★ 这一块必须单独写，不能只靠下面那条正则。
    #
    #   后台路径是**可配置**的（README 里建议改成一串随机字符，
    #   因为 /admin/ 是所有扫描器的第一个探测目标）。
    #   如果只匹配固定的 /admin/，用户换成 /manage-xxx/ 之后，
    #   请求就会掉进 location / 被 try_files 换成 Vue 的 index.html ——
    #   后台打不开，而且返回的是 200 不是 404，
    #   看起来像"后台坏了"，很难联想到是 nginx 没配路由。
    #
    #   ^~ 前缀匹配的优先级高于正则匹配，所以这一段会先命中。
    #
    #   proxy_pass 后面**不加路径**，这样 URI 原样透传：
    #   /manage-xxx/login/  ->  http://backend:8000/manage-xxx/login/
    location ^~ /${ADMIN_URL_PATH} {
        proxy_pass http://backend:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # 后台不需要上传大文件，维持一个小的上限（比 server 级那个 12m 更紧）。
        # ★ 这里**故意**和 /api/ 不一样：Django admin 的用途是改数据，
        #   唯一可能要传的是一张封面图，2m 绰绰有余。
        client_max_body_size 2m;
    }

    # ------------------------------------------------------------------
    # 后端接口
    # ------------------------------------------------------------------
    location ~ ^/(api|admin|health)/ {
        proxy_pass http://backend:8000;

        # ★ 显式设置 Host，不要依赖默认值。
        #    Django 的 ALLOWED_HOSTS 校验的就是这个头。
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # ★★★ 透传，不是 $scheme —— 理由见文件开头那段，写错就是无限重定向。
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # ★★★ 这一行是必须的，不是"调优"。
        #
        #    一次文章生成是**同步**请求，要真的联网搜索、读网页、
        #    反复调用大模型，耗时 30~120 秒，最坏情况更久。
        #    nginx 的 proxy_read_timeout 默认只有 60 秒，
        #    用默认值的话生成大文章**必然** 504 —— 而且用户看到的是
        #    "服务器错误"，但后端其实还在老老实实地跑。
        #
        #    ★ 前面那层宝塔也有同样的 60 秒默认值，那边必须一起调大，
        #      否则请求在宝塔就被切断了，这里配多长都没用。见 README 12.10。
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 10s;

        # 长响应边收边发，不要等整个响应体收完再转给浏览器
        proxy_buffering off;
    }

    # ------------------------------------------------------------------
    # 后端静态文件（Admin 的 CSS/JS 由 whitenoise 提供）
    # ------------------------------------------------------------------
    location /static/ {
        proxy_pass http://backend:8000;

        # ★★★ X-Forwarded-Proto 同样必须透传（不是 $scheme）——
        #     理由见文件开头那段。
        #
        #     这一处**尤其**不能漏：漏了的表现是后台能登录、但**完全没有样式**
        #     —— CSS 请求被 Django 301 到 https，绕回来还是 http，
        #     循环到浏览器放弃。看上去像"前端资源没打包进去"，
        #     实际上和静态文件本身毫无关系。
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        expires 7d;
        access_log off;
    }
}
