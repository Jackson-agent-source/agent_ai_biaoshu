# ============================================================
# 对外唯一入口（两个 server 块：80 只做跳转，443 是真正的站点）
#
#   /                    -> 前端静态文件（Vue 打包产物）
#   /api/ /health/       -> 反代给 Django
#   /<ADMIN_URL_PATH>    -> 反代给 Django 后台（默认 /admin/）
#   /static/             -> 反代给 Django（whitenoise 提供的 Admin CSS 等）
#   /media/              -> 直接从 uploads 卷发 AI 配图（不经过 Django）
#
# 这样浏览器看到的前端和 API 是**同一个源**，
# CORS、Cookie、预检请求的问题一次性全部消失。
#
# ★★★ 这个文件是**模板**，不是最终的 nginx 配置。
#     Dockerfile 把它拷成 /etc/nginx/templates/default.conf.template，
#     nginx 官方镜像的入口脚本会用 envsubst 把 ${ADMIN_URL_PATH} 和
#     ${PUBLIC_HOST} 替换成实际值，再生成 /etc/nginx/conf.d/default.conf。
#
#     envsubst 只会替换**环境里真实存在**的变量，所以下面那些
#     $uri / $host / $remote_addr / $scheme 是 nginx 自己的变量，不会被动到。
#     这两个变量在 Dockerfile 里都有默认值、compose 里也会传，
#     保证一定被替换掉 —— 万一没替换，nginx 会因为不认识这个变量而起不来，
#     报 "unknown \"admin_url_path\" variable"，一眼就知道问题在哪。
#
# ★ 证书由**宿主机**上的 certbot 签发和续期，compose 把 /etc/letsencrypt
#   只读挂进容器。签发/续期的完整步骤见 README 12.10。
# ============================================================


# ============================================================
# ① HTTP（80）：只做跳转 + 健康检查 + ACME 验证
# ============================================================
server {
    listen 80;
    server_name ${PUBLIC_HOST};

    client_max_body_size 2m;

    # 关掉版本号，别白送给扫描器
    server_tokens off;

    # ------------------------------------------------------------------
    # 容器自己的健康检查打这里
    # ------------------------------------------------------------------
    # ★ 为什么不能让它打 / —— 那会 301 到 https://127.0.0.1/，
    #   而证书是签给**域名**的，校验必然失败，web 容器会永远显示 unhealthy
    #   （功能其实完全正常，纯粹是白排查一场）。
    #
    # ★ 也不能改成让健康检查打 https://127.0.0.1/healthz：
    #   这个镜像基于 alpine，wget 是 busybox 版，做不了正经的 TLS 校验。
    #
    # ★ 路径特意叫 /healthz 而不是 /health/ —— 后者是 Django 的接口，
    #   两个名字长得像会让人以为是同一个东西。
    location = /healthz {
        return 200 "ok\n";
    }

    # ------------------------------------------------------------------
    # Let's Encrypt 续期验证（webroot 模式）
    # ------------------------------------------------------------------
    # ★ certbot 续期时会往 /var/www/certbot/.well-known/acme-challenge/
    #   写一个随机文件名，然后从公网访问 http://<域名>/.well-known/... 读回来。
    #   这条路径必须**在跳转之前**放行，否则验证请求会被 301 到 https，
    #   而 certbot 走的是明文 http，验证必然失败。
    #
    # ★ ^~ 前缀匹配优先于正则，也优先于下面的 location /。
    #
    # ★ 首次签发用的是 --standalone（那时应用还没占 80 端口），
    #   用不到这个块；它是给**此后每次自动续期**用的。见 README 12.10。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    # ------------------------------------------------------------------
    # 其余一律跳 HTTPS
    # ------------------------------------------------------------------
    # ★ 必须用 ${PUBLIC_HOST} 而不是 $host。
    #   $host 来自请求头，是**请求方可控**的 —— 任何人带一个伪造的
    #   Host 头打过来，这里就会 301 到他指定的域名上去（开放重定向），
    #   正好可以拿来给自己的钓鱼站做跳板。
    location / {
        return 301 https://${PUBLIC_HOST}$request_uri;
    }
}


# ============================================================
# ② HTTPS（443）：真正的站点
# ============================================================
server {
    listen 443 ssl;

    # ★ nginx 1.25.1+ 的写法。旧的 `listen 443 ssl http2` 已经废弃，
    #   新版本会在日志里警告。
    http2 on;

    server_name ${PUBLIC_HOST};

    # ★ 不要加 `listen [::]:443;`。
    #   Docker 默认**不给容器 IPv6**，加了会直接起不来：
    #       socket() [::]:443 failed (97: Address family not supported by protocol)
    #   这个报错看着像端口被占，其实是协议族不支持，很难查。

    root /usr/share/nginx/html;
    index index.html;

    # 这个应用没有文件上传，2MB 足够，顺便挡掉超大请求体
    client_max_body_size 2m;

    # 关掉版本号，别白送给扫描器
    server_tokens off;

    # ------------------------------------------------------------------
    # TLS
    # ------------------------------------------------------------------
    # ★ 证书目录名就是域名，两处都由 ${PUBLIC_HOST} 拼出来。
    #
    # ★ 用 fullchain.pem 而不是 cert.pem：前者含中间证书，
    #   少了它安卓端（尤其微信内置浏览器）会报"证书链不完整"。
    #
    # ★ 整个 /etc/letsencrypt 被挂进容器（不是只挂 live/<域名>）——
    #   live/ 里全是符号链接，指向 ../../archive/...，只挂一层的话链接会断。
    ssl_certificate     /etc/letsencrypt/live/${PUBLIC_HOST}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${PUBLIC_HOST}/privkey.pem;

    # ★ TLSv1.2 要留着：老安卓机的微信内置浏览器只到 1.2，
    #   只开 1.3 的话那批用户会直接打不开。
    ssl_protocols TLSv1.2 TLSv1.3;

    # 只留 ECDHE。这些套件在 TLS 1.2/1.3 下都够用，而且不需要额外的
    # DH 参数文件（见下面"刻意不加的东西"）。
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ★ 刻意不加的三样，别"顺手补全"：
    #
    #   1) ssl_stapling —— Let's Encrypt 已经在 2025 年停掉了 OCSP 服务，
    #      加了只会让 nginx 去等一个永远不来的响应。
    #   2) ssl_dhparam —— 上面的 ssl_ciphers 里一个 DHE 套件都没有，
    #      用不上（而且 OpenSSL 3 已经不提供默认 DH 参数，硬加要先现生成一个文件）。
    #   3) add_header Strict-Transport-Security —— HSTS 由 Django 统一发
    #      （settings.py 的 SECURE_HSTS_SECONDS）。nginx 的 add_header 是
    #      **子块覆盖父块**：任何一个 location 里出现 add_header，
    #      server 级的所有 add_header 就全被丢掉。两处都发只会让规则更难推理。

    # 和 80 块里那个同名，给外部探活 / 排查用
    location = /healthz {
        return 200 "ok\n";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # ------------------------------------------------------------------
    # 前端页面
    # ------------------------------------------------------------------
    location / {
        # ★ history 模式路由的必需品。
        #
        #   前端用的是 createWebHistory()，所以 /articles/xxx 这种地址
        #   在服务器磁盘上**并不存在**对应的文件。没有这行的话，
        #   用户在文章详情页按 F5 会看到 nginx 的 404 页面，
        #   而不是应用本身 —— 这是 SPA 部署最经典的一个坑。
        try_files $uri $uri/ /index.html;
    }

    # ★ index.html 绝对不能缓存。
    #   它里面写着本次构建的那些带哈希的 JS/CSS 文件名；
    #   一旦被浏览器缓存住，你发了新版用户刷新还是加载旧的资源，
    #   表现是"更新了但页面上看不出变化"。
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    # /assets/ 下的文件名带内容哈希，内容变了文件名就变，
    # 所以可以放心让浏览器长期缓存。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ------------------------------------------------------------------
    # AI 配图（backend 写进共享卷，这里只读直发）
    # ------------------------------------------------------------------
    # ★ 为什么用 ^~：^~ 前缀匹配的优先级**高于正则匹配**。
    #   不加的话，请求会先做前缀匹配、再拿下面每一条正则去试一遍；
    #   现在那条 location ~ ^/(api|admin|health)/ 虽然匹配不到 /media/，
    #   但将来任何一条新加的正则一旦手滑命中 /media/，配图就会全挂，
    #   而且症状是"图片 404"而不是"nginx 起不来"，很难查。^~ 一次钉死。
    #
    # ★ 图片请求**不会**掉进 location / 的 try_files ... /index.html：
    #   那句 SPA 回退只对 location / 生效，/media/ 命中这个块之后
    #   就再也不看别的了。所以这里不需要（也不该）写 try_files ——
    #   try_files 和 alias 一起用是 nginx 上有名的坑
    #   （它会按 location 前缀而不是 alias 路径去拼）。
    #
    # ★ 必须是 alias 不是 root：
    #     alias 把 /media/x.jpg 映射成 /var/www/media/x.jpg
    #     root  会映射成 /var/www/media/media/x.jpg
    #   两边的结尾斜杠都要有，少一个就是 404。
    location ^~ /media/ {
        alias /var/www/media/;

        # 配图一旦写入就永不修改（重新生成是**新建一条记录 + 新文件名**），
        # 所以可以放心让浏览器长期缓存。
        # ★ 只用 add_header 写一条 Cache-Control，**不要**同时写 expires：
        #   两者都设会产生两个同名的 Cache-Control 响应头，语义还互相覆盖。
        add_header Cache-Control "public, max-age=31536000, immutable";

        # 配图是高频小文件，访问日志只会淹没有用的日志
        access_log off;
    }

    # ------------------------------------------------------------------
    # 后台（路径由 ADMIN_URL_PATH 决定，默认 /admin/）
    # ------------------------------------------------------------------
    # ★ 这一块必须单独写，不能只靠下面那条正则。
    #
    #   后台路径是**可配置**的（README 里建议改成一串随机字符，
    #   因为 /admin/ 是所有扫描器的第一个探测目标）。
    #   如果只匹配固定的 /admin/，用户换成 /manage-xxx/ 之后，
    #   请求就会掉进 location / 被 try_files 换成 Vue 的 index.html ——
    #   后台打不开，而且返回的是 200 不是 404，
    #   看起来像"后台坏了"，很难联想到是 nginx 没配路由。
    #
    #   ^~ 前缀匹配的优先级高于正则匹配，所以这一段会先命中。
    #
    #   proxy_pass 后面**不加路径**，这样 URI 原样透传：
    #   /manage-xxx/login/  ->  http://backend:8000/manage-xxx/login/
    location ^~ /${ADMIN_URL_PATH} {
        proxy_pass http://backend:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 2m;
    }

    # ------------------------------------------------------------------
    # 后端接口
    # ------------------------------------------------------------------
    location ~ ^/(api|admin|health)/ {
        proxy_pass http://backend:8000;

        # ★ 显式设置 Host，不要依赖默认值。
        #    Django 的 ALLOWED_HOSTS 校验的就是这个头。
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ★★★ 这一行是必须的，不是"调优"。
        #
        #    一次文章生成是**同步**请求，要真的联网搜索、读网页、
        #    反复调用大模型，耗时 30~120 秒，最坏情况更久。
        #    nginx 的 proxy_read_timeout 默认只有 60 秒，
        #    用默认值的话生成大文章**必然** 504 —— 而且用户看到的是
        #    "服务器错误"，但后端其实还在老老实实地跑。
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 10s;

        # 长响应边收边发，不要等整个响应体收完再转给浏览器
        proxy_buffering off;
    }

    # ------------------------------------------------------------------
    # 后端静态文件（Admin 的 CSS/JS 由 whitenoise 提供）
    # ------------------------------------------------------------------
    location /static/ {
        proxy_pass http://backend:8000;

        # ★★★ X-Forwarded-Proto 这一行是**必须**的，不是可选的。
        #
        #    打开 USE_HTTPS 之后 Django 会有 SECURE_SSL_REDIRECT：
        #    它判断"这个请求是不是 https"的唯一依据就是这个头
        #    （SECURE_PROXY_SSL_HEADER）。少了它，Django 认为请求是
        #    http，于是 301 到 https —— 而 nginx 转发时又没带这个头，
        #    于是**无限重定向**。
        #
        #    症状很怪：后台能登录，但**完全没有样式**
        #    （CSS 全被 301 循环吃掉了）。上面的 /api 和后台那两个
        #    location 一直都有这行，只有这里漏了 —— 加上。
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 7d;
        access_log off;
    }
}

