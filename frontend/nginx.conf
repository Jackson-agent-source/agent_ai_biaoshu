# ============================================================
# 对外唯一入口
#
#   /                    -> 前端静态文件（Vue 打包产物）
#   /api/ /health/       -> 反代给 Django
#   /<ADMIN_URL_PATH>    -> 反代给 Django 后台（默认 /admin/）
#   /static/             -> 反代给 Django（whitenoise 提供的 Admin CSS 等）
#
# 这样浏览器看到的前端和 API 是**同一个源**，
# CORS、Cookie、预检请求的问题一次性全部消失。
#
# ★★★ 这个文件是**模板**，不是最终的 nginx 配置。
#     Dockerfile 把它拷成 /etc/nginx/templates/default.conf.template，
#     nginx 官方镜像的入口脚本会用 envsubst 把 ${ADMIN_URL_PATH}
#     替换成实际值，再生成 /etc/nginx/conf.d/default.conf。
#
#     envsubst 只会替换**环境里真实存在**的变量，所以下面那些
#     $uri / $host / $remote_addr 是 nginx 自己的变量，不会被动到。
#     ADMIN_URL_PATH 在 Dockerfile 里有默认值、compose 里也会传，
#     保证一定被替换掉 —— 万一没替换，nginx 会因为不认识这个变量而起不来，
#     报 "unknown \"admin_url_path\" variable"，一眼就知道问题在哪。
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 这个应用没有文件上传，2MB 足够，顺便挡掉超大请求体
    client_max_body_size 2m;

    # 关掉版本号，别白送给扫描器
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # ------------------------------------------------------------------
    # 前端页面
    # ------------------------------------------------------------------
    location / {
        # ★ history 模式路由的必需品。
        #
        #   前端用的是 createWebHistory()，所以 /articles/xxx 这种地址
        #   在服务器磁盘上**并不存在**对应的文件。没有这行的话，
        #   用户在文章详情页按 F5 会看到 nginx 的 404 页面，
        #   而不是应用本身 —— 这是 SPA 部署最经典的一个坑。
        try_files $uri $uri/ /index.html;
    }

    # ★ index.html 绝对不能缓存。
    #   它里面写着本次构建的那些带哈希的 JS/CSS 文件名；
    #   一旦被浏览器缓存住，你发了新版用户刷新还是加载旧的资源，
    #   表现是"更新了但页面上看不出变化"。
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    # /assets/ 下的文件名带内容哈希，内容变了文件名就变，
    # 所以可以放心让浏览器长期缓存。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ------------------------------------------------------------------
    # 后台（路径由 ADMIN_URL_PATH 决定，默认 /admin/）
    # ------------------------------------------------------------------
    # ★ 这一块必须单独写，不能只靠下面那条正则。
    #
    #   后台路径是**可配置**的（README 里建议改成一串随机字符，
    #   因为 /admin/ 是所有扫描器的第一个探测目标）。
    #   如果只匹配固定的 /admin/，用户换成 /manage-xxx/ 之后，
    #   请求就会掉进 location / 被 try_files 换成 Vue 的 index.html ——
    #   后台打不开，而且返回的是 200 不是 404，
    #   看起来像"后台坏了"，很难联想到是 nginx 没配路由。
    #
    #   ^~ 前缀匹配的优先级高于正则匹配，所以这一段会先命中。
    #
    #   proxy_pass 后面**不加路径**，这样 URI 原样透传：
    #   /manage-xxx/login/  ->  http://backend:8000/manage-xxx/login/
    location ^~ /${ADMIN_URL_PATH} {
        proxy_pass http://backend:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 2m;
    }

    # ------------------------------------------------------------------
    # 后端接口
    # ------------------------------------------------------------------
    location ~ ^/(api|admin|health)/ {
        proxy_pass http://backend:8000;

        # ★ 显式设置 Host，不要依赖默认值。
        #    Django 的 ALLOWED_HOSTS 校验的就是这个头。
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ★★★ 这一行是必须的，不是"调优"。
        #
        #    一次文章生成是**同步**请求，要真的联网搜索、读网页、
        #    反复调用大模型，耗时 30~120 秒，最坏情况更久。
        #    nginx 的 proxy_read_timeout 默认只有 60 秒，
        #    用默认值的话生成大文章**必然** 504 —— 而且用户看到的是
        #    "服务器错误"，但后端其实还在老老实实地跑。
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 10s;

        # 长响应边收边发，不要等整个响应体收完再转给浏览器
        proxy_buffering off;
    }

    # ------------------------------------------------------------------
    # 后端静态文件（Admin 的 CSS/JS 由 whitenoise 提供）
    # ------------------------------------------------------------------
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        expires 7d;
        access_log off;
    }
}
